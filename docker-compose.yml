services:
  db:
    image: postgres:15-alpine
    container_name: tennis-db
    environment:
      POSTGRES_DB: tennis_club
      POSTGRES_USER: tennis_admin
      POSTGRES_PASSWORD: br0do26_
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis_admin -d tennis_club"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tennis-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tennis_club
      SPRING_DATASOURCE_USERNAME: tennis_admin
      SPRING_DATASOURCE_PASSWORD: br0do26_
      DB_URL: jdbc:postgresql://db:5432/tennis_club
      DB_USER: tennis_admin
      DB_PASSWORD: br0do26_
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
